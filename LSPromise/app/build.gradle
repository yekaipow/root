plugins {
    id 'com.android.application'
}

android {
    namespace 'org.lsposed.lspromise'
    compileSdk = 37
    ndkVersion "27.2.12479018"

    // 两个变体：
    //   android17 -> minSdk 37，原始漏洞链目标（Android 17 / API 37 设备）
    //   compat    -> minSdk 34，仅用于低版本设备验证能否安装/启动，提权链路不保证
    flavorDimensions "api"

    productFlavors {
        android17 {
            dimension = "api"
            minSdk = 37
        }
        compat {
            dimension = "api"
            minSdk = 34
            applicationIdSuffix = ".compat"
            versionNameSuffix = "-compat"
        }
    }

    defaultConfig {
        applicationId "org.lsposed.lspromise"
        targetSdk = 37
        versionCode = 1
        versionName = "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk.abiFilters += "arm64-v8a"
    }

    signingConfigs {
        // 固定签名：CI 每次跑都用同一把 key，避免“更新安装失败/签名不一致”
        release {
            storeFile file("../keystore/lspromise.jks")
            storePassword "android"
            keyAlias "lspromise"
            keyPassword "android"
            enableV1Signing = false
            enableV2Signing = true
            enableV3Signing = true
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    externalNativeBuild {
        cmake {
            path("src/main/jni/CMakeLists.txt")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
}
